<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Idea Forge · 交互原型</title>
<style>
/* ============================================================
   Idea Forge · 设计令牌（严格来自 docs/product-design.md §3）
   ============================================================ */
:root{
  /* 3.1 中性灰阶 */
  --neutral-0:#FFFFFF; --neutral-25:#FCFCFD; --neutral-50:#F7F8FA; --neutral-100:#F1F2F5;
  --neutral-150:#E9EBEF; --neutral-200:#E1E3E9; --neutral-300:#CDD1DA; --neutral-400:#A8AEBB;
  --neutral-500:#7E8698; --neutral-600:#5C6373; --neutral-700:#43485A; --neutral-800:#2C3040; --neutral-900:#1A1D28;
  /* 3.2 强调色 Indigo（全站唯一） */
  --accent-50:#F1F3FE; --accent-100:#E0E5FD; --accent-200:#C3CBFB; --accent-300:#9DA9F7;
  --accent-500:#5563EA; --accent-600:#3F4BD1; --accent-700:#333CA8; --accent-800:#2A3183;
  /* 3.3 状态色 */
  --success-50:#E8F6EE; --success-500:#2F9E63; --success-600:#217A4B;
  --warning-50:#FEF4E6; --warning-500:#D98214; --warning-600:#A8630C;
  --danger-50:#FDEDED;  --danger-500:#D64545;  --danger-600:#A93535;
  --info-50:#EAF2FE;    --info-500:#3B82D6;    --info-600:#2C67AB;
  /* 3.4 数据可视化 */
  --cat-1:#D97757; --cat-2:#5B9E8A; --cat-3:#C9A227; --cat-4:#7E9BC7; --cat-5:#B07AA1; --cat-6:#8A8F98;
  --seq-1:#F1F3FE; --seq-2:#C3CBFB; --seq-3:#9DA9F7; --seq-4:#5563EA; --seq-5:#333CA8;
  /* 3.5 字体 */
  --font-sans:"Inter",-apple-system,"SF Pro Text","Segoe UI",Roboto,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",sans-serif;
  --font-mono:"JetBrains Mono","SF Mono","Cascadia Code",Consolas,"Courier New",monospace;
  /* 3.7 间距 / 圆角 / 阴影 / 边框 */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px;
  --r-xs:3px; --r-sm:4px; --r-md:6px; --r-lg:10px; --r-xl:14px; --r-full:999px;
  --shadow-xs:0 1px 2px rgba(26,29,40,.05);
  --shadow-sm:0 1px 3px rgba(26,29,40,.06),0 1px 2px rgba(26,29,40,.04);
  --shadow-md:0 4px 12px rgba(26,29,40,.07),0 1px 3px rgba(26,29,40,.05);
  --shadow-lg:0 12px 32px rgba(26,29,40,.10),0 2px 8px rgba(26,29,40,.06);
  --shadow-ring:0 0 0 3px var(--accent-100);
  --border-subtle:var(--neutral-150); --border:var(--neutral-200); --border-strong:var(--neutral-300);
  --sidebar-w:240px; --topbar-h:56px; --crumb-h:32px; --toolbar-h:44px;
}
/* 3.6 + 3.8 密度令牌：唯一密度机制 [data-density] */
[data-density="compact"]{
  --fs-xs:11px; --fs-sm:12px; --fs-base:13px; --fs-md:15px; --fs-lg:18px; --fs-xl:22px; --fs-metric:28px;
  --lh-xs:16px; --lh-sm:18px; --lh-base:20px; --lh-md:22px; --lh-lg:26px; --lh-xl:30px; --lh-metric:34px;
  --row-h:32px; --cell-px:8px; --card-pad:12px; --section-gap:16px; --fs-table:12px; --hit:28px; --chart-h:280px;
}
[data-density="comfortable"]{
  --fs-xs:12px; --fs-sm:13px; --fs-base:14px; --fs-md:16px; --fs-lg:18px; --fs-xl:22px; --fs-metric:28px;
  --lh-xs:16px; --lh-sm:18px; --lh-base:20px; --lh-md:24px; --lh-lg:26px; --lh-xl:30px; --lh-metric:34px;
  --row-h:44px; --cell-px:14px; --card-pad:16px; --section-gap:20px; --fs-table:14px; --hit:44px; --chart-h:220px;
}
/* ============================ 基础 ============================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-sans);font-size:var(--fs-base);line-height:var(--lh-base);
  color:var(--neutral-700);background:#E9EBF0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-600);text-decoration:none}
:focus{outline:none}
:focus-visible{box-shadow:var(--shadow-ring);border-radius:var(--r-sm)}
.num,td.num,th.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
::selection{background:var(--accent-100)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--neutral-300);border-radius:var(--r-full);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--neutral-400);background-clip:content-box;border:2px solid transparent}
::-webkit-scrollbar-track{background:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* 工具类 */
.row{display:flex;align-items:center}.row.top{align-items:flex-start}.row.base{align-items:baseline}
.grow{flex:1;min-width:0}.shrink0{flex:none}
.g1{gap:var(--sp-1)}.g2{gap:var(--sp-2)}.g3{gap:var(--sp-3)}.g4{gap:var(--sp-4)}.g5{gap:var(--sp-5)}.g6{gap:var(--sp-6)}
.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column}
.between{justify-content:space-between}.center{justify-content:center}.end{justify-content:flex-end}
.ac{align-items:center}.rel{position:relative}
.mt1{margin-top:var(--sp-1)}.mt2{margin-top:var(--sp-2)}.mt3{margin-top:var(--sp-3)}.mt4{margin-top:var(--sp-4)}
.mt5{margin-top:var(--sp-5)}.mt6{margin-top:var(--sp-6)}.mb2{margin-bottom:var(--sp-2)}.mb3{margin-bottom:var(--sp-3)}
.mb4{margin-bottom:var(--sp-4)}.ml2{margin-left:var(--sp-2)}.mr2{margin-right:var(--sp-2)}
.fs-xs{font-size:var(--fs-xs);line-height:var(--lh-xs)}
.fs-sm{font-size:var(--fs-sm);line-height:var(--lh-sm)}
.fs-base{font-size:var(--fs-base);line-height:var(--lh-base)}
.fs-md{font-size:var(--fs-md);line-height:var(--lh-md);font-weight:600}
.fs-lg{font-size:var(--fs-lg);line-height:var(--lh-lg);font-weight:600;color:var(--neutral-800)}
.fs-xl{font-size:var(--fs-xl);line-height:var(--lh-xl);font-weight:600;color:var(--neutral-900)}
.muted{color:var(--neutral-500)}.dim{color:var(--neutral-400)}.ink{color:var(--neutral-800)}
.strong{font-weight:600}.nowrap{white-space:nowrap}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pt{pointer-events:none}
.hr{height:1px;background:var(--border-subtle);border:0;margin:0}
/* ============================ 舞台 / 设备框架 ============================ */
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px 96px;gap:16px}
.stage-title{font-size:var(--fs-sm);color:var(--neutral-500);letter-spacing:.02em}
.stage-title b{color:var(--neutral-700);font-weight:600}
.app{width:1440px;max-width:100%;height:calc(100vh - 150px);min-height:640px;background:var(--neutral-25);
  display:flex;position:relative;overflow:hidden;border:1px solid var(--border);border-radius:var(--r-xl);
  box-shadow:0 20px 60px rgba(26,29,40,.16),0 2px 8px rgba(26,29,40,.06)}
.app[data-device="mobile"]{width:390px;height:812px;min-height:0;border-radius:28px;border:1px solid var(--neutral-300);
  box-shadow:0 24px 60px rgba(26,29,40,.22),0 0 0 8px #E2E5EC}
.app-cols{display:flex;flex:1;min-width:0}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--neutral-25)}
/* ============================ 侧边栏 ============================ */
.sidebar{width:var(--sidebar-w);flex:none;background:var(--neutral-0);border-right:1px solid var(--border-subtle);
  display:flex;flex-direction:column;font-size:var(--fs-sm)}
.app[data-sidebar="collapsed"] .sidebar{width:56px}
.app[data-sidebar="collapsed"] .sb-label,.app[data-sidebar="collapsed"] .sb-sec,
.app[data-sidebar="collapsed"] .sb-sub,.app[data-sidebar="collapsed"] .sb-meta,
.app[data-sidebar="collapsed"] .sb-caret,.app[data-sidebar="collapsed"] .sb-foot span{display:none}
.app[data-sidebar="collapsed"] .sb-item{justify-content:center;padding:0}
.sb-head{height:var(--topbar-h);display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);
  border-bottom:1px solid var(--border-subtle);flex:none}
.sb-logo{width:24px;height:24px;border-radius:var(--r-sm);background:var(--accent-600);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:13px;flex:none}
.sb-body{flex:1;overflow:auto;padding:var(--sp-2) var(--sp-2)}
.sb-sec{font-size:10px;letter-spacing:.08em;color:var(--neutral-400);padding:var(--sp-3) var(--sp-2) var(--sp-1);text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:var(--sp-2);padding:6px var(--sp-2);border-radius:var(--r-sm);
  color:var(--neutral-700);cursor:pointer;position:relative;min-height:28px;text-align:left;width:100%}
.sb-item:hover{background:var(--neutral-50)}
.sb-item[aria-current="true"]{background:var(--accent-50);color:var(--accent-700);font-weight:500}
.sb-item[aria-current="true"]::before{content:"";position:absolute;left:-8px;top:2px;bottom:2px;width:3px;
  background:var(--accent-600);border-radius:0 2px 2px 0}
.sb-item .ico{width:16px;text-align:center;color:var(--neutral-400);flex:none;font-size:13px}
.sb-item[aria-current="true"] .ico{color:var(--accent-600)}
.sb-sub{padding-left:var(--sp-5)}
.sb-sub .sb-item{padding:4px var(--sp-2);font-size:var(--fs-xs);color:var(--neutral-600)}
.sb-sub2{padding-left:12px}
.sb-dot{margin-left:auto;min-width:16px;height:16px;padding:0 4px;border-radius:var(--r-full);background:var(--danger-500);
  color:#fff;font-size:10px;line-height:16px;text-align:center;font-variant-numeric:tabular-nums}
.sb-foot{border-top:1px solid var(--border-subtle);padding:var(--sp-2);flex:none}
.sb-foot .btn{width:100%;justify-content:flex-start}
/* ============================ 顶栏 ============================ */
.topbar{height:var(--topbar-h);flex:none;background:var(--neutral-0);border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-4)}
.tb-search{width:320px;flex:none;position:relative}
.tb-search input{width:100%;height:32px;border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--neutral-50);padding:0 56px 0 30px;font-size:var(--fs-sm)}
.tb-search input:focus{background:var(--neutral-0);border-color:var(--accent-300);box-shadow:var(--shadow-ring)}
.tb-search .mag{position:absolute;left:9px;top:9px;color:var(--neutral-400);font-size:12px}
.tb-search .kbd{position:absolute;right:7px;top:8px;font-size:10px;color:var(--neutral-400);border:1px solid var(--border);
  border-radius:var(--r-xs);padding:1px 4px;background:var(--neutral-0);font-family:var(--font-mono)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:var(--sp-2)}
.crumbs{height:var(--crumb-h);flex:none;display:flex;align-items:center;gap:6px;padding:0 var(--sp-4);
  font-size:var(--fs-sm);color:var(--neutral-500);background:var(--neutral-25);border-bottom:1px solid var(--border-subtle)}
.crumbs .seg-link{color:var(--neutral-500);border-radius:var(--r-xs);padding:1px 4px}
.crumbs .seg-link:hover{color:var(--accent-700);background:var(--accent-50)}
.crumbs .cur{color:var(--neutral-800);font-weight:600}
.crumbs .sep{color:var(--neutral-300)}
/* ============================ 主视图区 ============================ */
.view{flex:1;overflow:auto;padding:var(--sp-5) var(--sp-6) var(--sp-10);scroll-behavior:smooth}
.view.flush{padding:0}
.page-head{display:flex;align-items:flex-end;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.page-head .sub{font-size:var(--fs-sm);color:var(--neutral-500)}
/* ============================ 基础组件 ============================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 var(--sp-3);
  border-radius:var(--r-md);border:1px solid var(--border);background:var(--neutral-0);color:var(--neutral-700);
  font-size:var(--fs-sm);font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s,box-shadow .12s}
.btn:hover{background:var(--neutral-50);border-color:var(--border-strong)}
.btn:active{background:var(--neutral-100)}
.btn.primary{background:var(--accent-600);border-color:var(--accent-600);color:#fff}
.btn.primary:hover{background:var(--accent-700);border-color:var(--accent-700)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--neutral-100)}
.btn.danger{color:var(--danger-600);border-color:var(--border)}
.btn.danger:hover{background:var(--danger-50);border-color:var(--danger-500)}
.btn.sm{height:24px;padding:0 var(--sp-2);font-size:var(--fs-xs)}
.btn.lg{height:40px;padding:0 var(--sp-4);font-size:var(--fs-base)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.btn.icon{width:32px;padding:0}
.btn.icon.sm{width:24px}
.btn.loading{pointer-events:none;color:transparent;position:relative}
.btn.loading::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--neutral-300);
  border-top-color:var(--neutral-600);border-radius:50%;animation:spin .7s linear infinite}
.btn.primary.loading::after{border-color:rgba(255,255,255,.4);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.link{color:var(--accent-600);cursor:pointer;border-radius:var(--r-xs);font-size:inherit}
.link:hover{text-decoration:underline}
.inp{height:32px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--neutral-0);
  padding:0 var(--sp-2);font-size:var(--fs-sm);min-width:0}
.inp:hover{border-color:var(--border-strong)}
.inp:focus{border-color:var(--accent-300);box-shadow:var(--shadow-ring)}
.sel{height:28px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--neutral-0);
  padding:0 22px 0 var(--sp-2);font-size:var(--fs-sm);color:var(--neutral-700);cursor:pointer;
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%237E8698' stroke-width='1.4' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 7px center;max-width:100%}
.sel:hover{border-color:var(--border-strong)}
.sel:focus{border-color:var(--accent-300);box-shadow:var(--shadow-ring)}
.sel option:disabled{color:var(--neutral-300)}
textarea.inp{height:auto;padding:6px var(--sp-2);line-height:1.6;resize:vertical;width:100%}
/* 分段控件 */
.seg{display:inline-flex;background:var(--neutral-100);border-radius:var(--r-md);padding:2px;gap:2px}
.seg button{height:24px;padding:0 10px;border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--neutral-600);
  white-space:nowrap;transition:background .12s,color .12s;min-width:56px;text-align:center}
.seg button:hover{color:var(--neutral-800)}
.seg button[aria-pressed="true"]{background:var(--neutral-0);color:var(--neutral-800);font-weight:500;box-shadow:var(--shadow-xs)}
.seg.lg button{height:28px;padding:0 14px}
/* Chip */
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--neutral-0);color:var(--neutral-600);font-size:var(--fs-xs);
  white-space:nowrap;max-width:220px}
.chip.sm{height:20px;padding:0 6px}
.chip.sel{background:var(--accent-50);border-color:var(--accent-200);color:var(--accent-700);font-weight:500}
.chip.sel::before{content:"✓";font-size:10px}
.chip.warn{background:var(--warning-50);border-color:var(--warning-500);color:var(--warning-600)}
.chip.info{background:var(--info-50);border-color:var(--info-500);color:var(--info-600)}
.chip.danger{background:var(--danger-50);border-color:var(--danger-500);color:var(--danger-600)}
.chip.ok{background:var(--success-50);border-color:var(--success-500);color:var(--success-600)}
.chip .x{margin-left:2px;color:var(--neutral-400);border-radius:2px;padding:0 1px;font-size:11px}
.chip .x:hover{color:var(--danger-600);background:var(--danger-50)}
.chip.mono{font-family:var(--font-mono)}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--border-strong);background:var(--neutral-50)}
button.chip.sel:hover{background:var(--accent-50)}
/* Badge / 状态 */
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:var(--r-full);
  font-size:var(--fs-xs);font-weight:500;white-space:nowrap;background:var(--neutral-100);color:var(--neutral-600)}
.badge.md{height:24px;padding:0 9px;font-size:var(--fs-sm)}
.badge.accent{background:var(--accent-600);color:#fff}
.badge.danger{background:var(--danger-500);color:#fff}
.badge.neutral{background:var(--neutral-100);color:var(--neutral-500)}
.badge.ok{background:var(--success-50);color:var(--success-600)}
.badge.warn{background:var(--warning-50);color:var(--warning-600)}
.sb-status{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px 0 6px;border-radius:var(--r-full);
  font-size:var(--fs-xs);font-weight:500;white-space:nowrap;line-height:1}
.sb-status.md{height:24px;padding:0 10px 0 8px;font-size:var(--fs-sm)}
.sb-status .dot{width:7px;height:7px;border-radius:50%;flex:none}
.sb-status.pending{background:var(--neutral-50);color:var(--neutral-600)}
.sb-status.pending .dot{border:1.5px solid var(--neutral-400);background:transparent}
.sb-status.running{background:var(--accent-50);color:var(--accent-700)}
.sb-status.running .dot{background:var(--accent-600);animation:pulseRing 1.6s infinite}
.sb-status.done{background:var(--success-50);color:var(--success-600)}
.sb-status.done .dot{background:var(--success-500)}
.sb-status.missing{background:var(--warning-50);color:var(--warning-600)}
.sb-status.missing .dot{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
  border-bottom:7px solid var(--warning-500);border-radius:1px;background:none}
.sb-status.failed{background:var(--danger-50);color:var(--danger-600)}
.sb-status.failed .dot{background:var(--danger-500)}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(63,75,209,.4)}70%{box-shadow:0 0 0 5px rgba(63,75,209,0)}100%{box-shadow:0 0 0 0 rgba(63,75,209,0)}}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent-600);animation:pulseRing 1.6s infinite;flex:none}
/* 来源徽章 */
.src{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:var(--r-full);font-size:var(--fs-xs)}
.src.agent{background:var(--info-50);color:var(--info-600)}
.src.human{background:var(--neutral-100);color:var(--neutral-600)}
/* 卡片 */
.card{background:var(--neutral-0);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card.pad{padding:var(--card-pad)}
.card.hoverable{transition:box-shadow .14s,transform .14s,border-color .14s}
.card.hoverable:hover{box-shadow:var(--shadow-md);border-color:var(--accent-200);transform:translateY(-1px)}
.card-title{font-size:var(--fs-md);line-height:var(--lh-md);font-weight:600;color:var(--neutral-800);
  display:flex;align-items:center;gap:var(--sp-2)}
.card-sub{font-size:var(--fs-xs);color:var(--neutral-500);margin-top:2px}
/* 工具条 */
.toolbar{height:var(--toolbar-h);flex:none;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-4);
  background:var(--neutral-0);border-bottom:1px solid var(--border-subtle);position:sticky;top:0;z-index:8}
.toolbar.wrap2{height:auto;min-height:var(--toolbar-h);flex-wrap:wrap;padding:var(--sp-2) var(--sp-4);gap:var(--sp-2)}
/* 表格 */
.tw{overflow:auto;background:var(--neutral-0);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:var(--fs-table)}
table.t th,table.t td{padding:0 var(--cell-px);height:var(--row-h);text-align:left;white-space:nowrap;
  border-bottom:1px solid var(--border-subtle);vertical-align:middle}
table.t thead th{position:sticky;top:0;z-index:3;background:var(--neutral-50);color:var(--neutral-500);
  font-size:var(--fs-xs);font-weight:600;height:32px;box-shadow:var(--shadow-xs);white-space:nowrap}
table.t thead th.sortable{cursor:pointer}
table.t thead th.sortable:hover{color:var(--accent-700)}
table.t thead th .arrow{color:var(--accent-600);margin-left:3px}
table.t tbody tr{transition:background .1s}
table.t tbody tr:hover{background:var(--neutral-50)}
table.t tbody tr.sel{background:var(--accent-50)}
table.t tbody tr.arch{opacity:.5}
table.t tbody tr:last-child td{border-bottom:0}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t .sticky-l{position:sticky;left:0;background:var(--neutral-0);z-index:2}
table.t thead .sticky-l{z-index:4;background:var(--neutral-50)}
table.t tbody tr:hover .sticky-l{background:var(--neutral-50)}
table.t tbody tr.sel .sticky-l{background:var(--accent-50)}
table.t tbody tr.arch .sticky-l{background:var(--neutral-0)}
.bar3{position:absolute;left:0;top:0;bottom:0;width:3px}
.sbar{display:flex;height:3px;width:100%;border-radius:2px;overflow:hidden;background:var(--neutral-100)}
.sbar i{display:block;height:100%}
.ck{width:14px;height:14px;border:1.5px solid var(--neutral-300);border-radius:3px;background:var(--neutral-0);
  display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:9px;flex:none}
.ck.on{background:var(--accent-600);border-color:var(--accent-600)}
.ck.mid{background:var(--accent-600);border-color:var(--accent-600);opacity:.55}
/* 缺失斜纹 */
.missing{background-image:repeating-linear-gradient(45deg,var(--neutral-100) 0 4px,transparent 4px 8px)}
.heat{transition:transform .1s,box-shadow .1s}
/* 键值表面板 */
.kv{width:100%;border-collapse:separate;border-spacing:0}
.kv tr{height:var(--row-h)}
.kv td{padding:0 var(--sp-2);border-bottom:1px solid var(--border-subtle);font-size:var(--fs-sm);white-space:nowrap}
.kv tr:last-child td{border-bottom:0}
.kv td.k{width:40%;color:var(--neutral-500);font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis}
.kv td.v{color:var(--neutral-800);font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.kv tr.same td{color:var(--neutral-400)}
.kv tr.same td.v{color:var(--neutral-400)}
.kv tr.chg{background:var(--accent-50)}
.kv tr.chg td.v{color:var(--accent-700);font-weight:600}
.kv tr.chg td:first-child{box-shadow:inset 3px 0 0 var(--accent-600)}
.kv tr.only{background:var(--warning-50)}
.kv tr.only td:first-child{box-shadow:inset 3px 0 0 var(--warning-500)}
.kv .old{color:var(--neutral-400);text-decoration:line-through;margin-right:6px}
.kv .ty{color:var(--neutral-400);font-size:var(--fs-xs);margin-right:5px;font-family:var(--font-mono)}
.kv .delta{font-size:var(--fs-xs);color:var(--neutral-400);font-family:var(--font-mono)}
/* DiffTable */
.dt{width:100%;border-collapse:separate;border-spacing:0}
.dt th{position:sticky;top:0;z-index:2;background:var(--neutral-0);height:32px;font-size:var(--fs-xs);
  color:var(--neutral-500);text-align:left;padding:0 var(--sp-2);border-bottom:1px solid var(--border-strong)}
.dt td{height:var(--row-h);padding:0 var(--sp-2);border-bottom:1px solid var(--border-subtle);font-size:var(--fs-sm);
  font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0}
.dt td.k{color:var(--neutral-500)}
.dt tr.same td{color:var(--neutral-400)}
.dt tr.chg{background:var(--accent-50)}
.dt tr.chg td:first-child{box-shadow:inset 3px 0 0 var(--accent-600)}
.dt tr.chg td.b{color:var(--accent-700);font-weight:600}
.dt tr.only{background:var(--warning-50)}
.dt tr.only td:first-child{box-shadow:inset 3px 0 0 var(--warning-500)}
.dt td.d{font-size:var(--fs-xs);color:var(--neutral-600)}
.dt td.d.good{color:var(--success-600)}
.dt td.d.bad{color:var(--danger-600)}
.dt .arr{color:var(--neutral-300);margin:0 6px}
.foldrow td{background:var(--neutral-50);color:var(--neutral-500);cursor:pointer;font-family:var(--font-sans);font-size:var(--fs-xs)}
.foldrow td:hover{background:var(--neutral-100)}
/* 矩阵 */
.mx-wrap{overflow:auto;background:var(--neutral-0);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
table.mx{border-collapse:separate;border-spacing:0}
table.mx th,table.mx td{padding:0;border-bottom:1px solid var(--border-subtle);border-right:1px solid var(--border-subtle)}
table.mx thead th{position:sticky;top:0;z-index:3;background:var(--neutral-50);height:40px;padding:0 var(--sp-2);
  text-align:left;vertical-align:middle;box-shadow:var(--shadow-xs)}
table.mx thead th.cur{box-shadow:inset 0 -2px 0 var(--accent-600),var(--shadow-xs)}
table.mx thead th.rh{left:0;z-index:4}
table.mx tbody th.rh{position:sticky;left:0;z-index:2;background:var(--neutral-0);width:168px;min-width:168px;
  padding:0 var(--sp-2) 0 var(--sp-3);text-align:left;border-right:1px solid var(--border);vertical-align:middle;height:var(--row-h)}
table.mx tbody tr.arch th.rh,table.mx tbody tr.arch td{opacity:.5}
table.mx tbody tr.arch td{border-bottom-style:dashed}
table.mx tfoot th,table.mx tfoot td{position:sticky;bottom:0;z-index:3;background:var(--neutral-50);height:30px;
  padding:0 var(--sp-2);font-size:var(--fs-xs);color:var(--neutral-500);border-top:1px solid var(--border-strong)}
table.mx tfoot th.rh{left:0;z-index:4;border-right:1px solid var(--border)}
.mx-cell{height:var(--row-h);min-width:88px;text-align:center;position:relative;cursor:pointer;
  border-right:1px solid var(--border-subtle);transition:box-shadow .1s,transform .1s}
.mx-cell .n{font-size:var(--fs-md);font-weight:600;line-height:1;font-variant-numeric:tabular-nums;
  display:block;margin-top:3px;color:var(--neutral-800)}
.mx-cell.dark .n{color:var(--neutral-0)}
.mx-cell .bb{position:absolute;top:3px;right:4px;display:flex;gap:3px;font-size:10px;line-height:12px;
  font-variant-numeric:tabular-nums}
.mx-cell.dark .bb{color:rgba(255,255,255,.92)}
.mx-cell .bb .ok{color:var(--success-600)}
.mx-cell .bb .fail{color:var(--danger-600)}
.mx-cell.dark .bb .ok,.mx-cell.dark .bb .fail{color:#fff}
.mx-cell .mini{position:absolute;left:0;right:0;bottom:0;height:3px}
.mx-cell:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);z-index:5;outline:1px solid var(--accent-300);outline-offset:-1px}
.mx-cell.selc{outline:2px solid var(--accent-600);outline-offset:-2px;z-index:6}
.mx-cell.empty{background:var(--neutral-50);cursor:default}
.mx-cell.empty:hover{box-shadow:none;transform:none;outline:none}
.mx-cell .no{display:block;font-size:var(--fs-xs);color:var(--neutral-300);line-height:var(--row-h);margin-top:0}
.legend{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-xs);color:var(--neutral-500)}
.legend .bar{width:160px;height:8px;border-radius:var(--r-full);
  background:linear-gradient(90deg,var(--seq-1),var(--seq-2),var(--seq-3),var(--seq-4),var(--seq-5))}
.legend .sw{width:14px;height:8px;border-radius:2px;border:1px solid var(--border)}
/* 树画布 */
.canvas{position:relative;background:var(--neutral-25);overflow:hidden;flex:1;cursor:grab;
  background-image:radial-gradient(var(--neutral-150) 1px,transparent 1px);background-size:24px 24px}
.canvas.drag{cursor:grabbing}
.canvas-inner{position:absolute;top:0;left:0;transform-origin:0 0}
.canvas svg{position:absolute;top:0;left:0;overflow:visible}
.tnode{position:absolute;width:200px;height:72px;background:var(--neutral-0);border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:8px 10px 8px 13px;cursor:pointer;
  transition:box-shadow .14s,border-color .14s;overflow:hidden}
.tnode .st{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:var(--r-lg) 0 0 var(--r-lg)}
.tnode:hover{box-shadow:var(--shadow-md);border-color:var(--accent-300)}
.tnode.sel{box-shadow:var(--shadow-ring),var(--shadow-md);border-color:var(--accent-600)}
.tnode.validated{background:var(--success-50)}
.tnode.abandoned{opacity:.45;filter:grayscale(.6);border-style:dashed;border-color:var(--neutral-300)}
.tnode .t{font-size:var(--fs-md);line-height:18px;font-weight:600;color:var(--neutral-800);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tnode .m{font-size:10px;color:var(--neutral-500);margin-top:5px;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnode .v{position:absolute;right:8px;top:8px;font-size:11px;color:var(--success-600)}
.tnode .cnt{position:absolute;right:6px;bottom:5px;font-size:10px;background:var(--neutral-100);
  border-radius:var(--r-full);padding:1px 5px;color:var(--neutral-600)}
.tnode .dotf{position:absolute;right:8px;bottom:6px;width:6px;height:6px;border-radius:50%;background:var(--danger-500)}
.tnode .dotr{position:absolute;right:8px;bottom:6px;width:6px;height:6px;border-radius:50%;
  background:var(--accent-600);animation:pulseRing 1.6s infinite}
.tnode .ham{position:absolute;right:6px;top:6px;width:18px;height:18px;border-radius:var(--r-xs);
  display:none;align-items:center;justify-content:center;color:var(--neutral-500);font-size:12px}
.tnode:hover .ham{display:flex}
.tnode .ham:hover{background:var(--neutral-100)}
.tlist .li{display:flex;align-items:center;gap:var(--sp-2);padding:8px var(--sp-3);border-bottom:1px solid var(--border-subtle);
  cursor:pointer;position:relative}
.tlist .li:hover{background:var(--neutral-50)}
.tlist .li .st{position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:0 2px 2px 0}
.tlist .li .caret{width:16px;color:var(--neutral-400);flex:none;text-align:center;font-size:10px}
.tlist .li .nm{font-size:var(--fs-base);color:var(--neutral-800)}
.tlist .li .mt{font-size:var(--fs-xs);color:var(--neutral-500);margin-left:auto;font-variant-numeric:tabular-nums}
.tlist .li.abandoned{opacity:.5}
.tree-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
/* 图表 */
.chart-card{background:var(--neutral-0);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:var(--card-pad)}
.chart-box{height:var(--chart-h);position:relative}
.chart-box svg{display:block;width:100%;height:100%;overflow:visible}
.axis{stroke:var(--neutral-300);stroke-width:1}
.grid{stroke:var(--neutral-150);stroke-width:1}
.grid.strong{stroke:var(--neutral-300)}
.axis-t{font-size:10px;fill:var(--neutral-500);font-family:var(--font-sans)}
.pt{cursor:pointer}
.lgd{display:flex;flex-wrap:wrap;gap:var(--sp-3);font-size:var(--fs-xs);color:var(--neutral-600);align-items:center}
.lgd i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
/* 平行坐标 */
.pc-line{fill:none;stroke-width:1.5;stroke:var(--neutral-300);opacity:.5;transition:opacity .1s,stroke .1s}
.pc-line.hi{stroke:var(--accent-600);opacity:1}
.pc-dim{opacity:.15}
.pc-axis-title{font-size:11px;fill:var(--neutral-700);font-family:var(--font-mono);font-weight:600}
.pc-axis-mm{font-size:10px;fill:var(--neutral-400);font-family:var(--font-mono)}
.pc-brush{fill:var(--accent-100);opacity:.55}
/* 抽屉 */
.overlay{position:absolute;inset:0;background:rgba(26,29,40,.2);z-index:40;animation:fadeIn .16s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.drawer{position:absolute;top:0;right:0;bottom:0;width:420px;background:var(--neutral-0);z-index:41;
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slideIn .2s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.drawer.wide{width:520px}
.drawer-head{flex:none;display:flex;align-items:flex-start;gap:var(--sp-2);padding:var(--sp-4) var(--sp-4) var(--sp-3);
  border-bottom:1px solid var(--border-subtle)}
.drawer-body{flex:1;overflow:auto;padding:var(--sp-4)}
.drawer-foot{flex:none;display:flex;gap:var(--sp-2);justify-content:flex-end;padding:var(--sp-3) var(--sp-4);
  border-top:1px solid var(--border-subtle);background:var(--neutral-25)}
.app[data-device="mobile"] .drawer{width:100%;animation:slideInFull .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slideInFull{from{transform:translateX(100%)}to{transform:none}}
/* Toast */
.toasts{position:absolute;right:var(--sp-4);bottom:var(--sp-4);z-index:60;display:flex;flex-direction:column;gap:var(--sp-2);
  align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;background:var(--neutral-0);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);padding:10px var(--sp-3);font-size:var(--fs-sm);max-width:340px;display:flex;gap:var(--sp-2);
  align-items:flex-start;animation:toastIn .2s cubic-bezier(.2,.8,.2,1)}
@keyframes toastIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.toast .ti{width:16px;flex:none;text-align:center}
.toast.ok{border-left:3px solid var(--success-500)}
.toast.warn{border-left:3px solid var(--warning-500)}
.toast.err{border-left:3px solid var(--danger-500)}
.toast.info{border-left:3px solid var(--accent-600)}
/* Modal */
.modal-wrap{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:var(--sp-6)}
.modal{width:520px;max-width:100%;background:var(--neutral-0);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);
  overflow:hidden;animation:mIn .18s cubic-bezier(.2,.8,.2,1)}
.modal.sm{width:360px}
@keyframes mIn{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
/* 命令面板 */
.cmdp{width:560px;max-width:100%;background:var(--neutral-0);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);overflow:hidden}
.cmdp input{width:100%;height:48px;border:0;border-bottom:1px solid var(--border-subtle);padding:0 var(--sp-4);font-size:var(--fs-md)}
.cmdp .list{max-height:340px;overflow:auto;padding:var(--sp-2)}
.cmdp .grp{font-size:10px;color:var(--neutral-400);padding:var(--sp-2) var(--sp-2) 4px;letter-spacing:.06em}
.cmdp .it{display:flex;align-items:center;gap:var(--sp-2);padding:6px var(--sp-2);border-radius:var(--r-sm);cursor:pointer;font-size:var(--fs-sm)}
.cmdp .it .kind{font-size:10px;color:var(--neutral-400);width:52px;flex:none}
.cmdp .it[aria-selected="true"]{background:var(--accent-50)}
mark{background:var(--accent-100);color:inherit;border-radius:2px;padding:0 1px}
/* Tooltip */
.tip{position:absolute;z-index:80;background:var(--neutral-900);color:#fff;font-size:var(--fs-xs);line-height:1.55;
  padding:6px 9px;border-radius:var(--r-md);max-width:280px;pointer-events:none;box-shadow:var(--shadow-md);
  white-space:pre-line;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip .tk{font-family:var(--font-mono);color:var(--accent-200)}
/* 空态 / 骨架 / 错误 */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:var(--sp-12) var(--sp-6);gap:var(--sp-3)}
.empty .art{color:var(--neutral-300);margin-bottom:var(--sp-2)}
.empty .t{font-size:var(--fs-md);color:var(--neutral-800);font-weight:600}
.empty .d{font-size:var(--fs-sm);color:var(--neutral-500);max-width:380px;line-height:1.7}
.sk{background:var(--neutral-100);border-radius:var(--r-sm);animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:.95}}
.sk.t{height:12px}.sk.r{height:var(--row-h)}.sk.c{height:72px;border-radius:var(--r-lg)}
.err{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-3);
  padding:var(--sp-12) var(--sp-6);text-align:center}
.err .ic{width:40px;height:40px;border-radius:var(--r-full);background:var(--danger-50);color:var(--danger-600);
  display:flex;align-items:center;justify-content:center;font-size:20px}
.banner{display:flex;align-items:center;gap:var(--sp-2);padding:7px var(--sp-3);border-radius:var(--r-md);
  font-size:var(--fs-sm);border:1px solid transparent}
.banner.warn{background:var(--warning-50);color:var(--warning-600);border-color:#F3DDBF}
.banner.info{background:var(--info-50);color:var(--info-600);border-color:#CFE0F8}
.banner.neutral{background:var(--neutral-50);color:var(--neutral-600);border-color:var(--border)}
.banner.danger{background:var(--danger-50);color:var(--danger-600);border-color:#F6D0D0}
/* 进度不确定态 */
.prog{height:6px;border-radius:var(--r-full);background:var(--accent-200);overflow:hidden;position:relative;width:100%}
.prog::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(45deg,rgba(255,255,255,.55) 25%,transparent 25%,transparent 50%,
  rgba(255,255,255,.55) 50%,rgba(255,255,255,.55) 75%,transparent 75%);
  background-size:14px 14px;animation:stripes 1.4s linear infinite}
@keyframes stripes{from{background-position:0 0}to{background-position:28px 0}}
/* 移动端专用 */
.tabbar{display:none}
.app[data-device="mobile"] .sidebar{display:none}
.app[data-device="mobile"] .tabbar{display:flex;flex:none;height:56px;background:var(--neutral-0);
  border-top:1px solid var(--border-subtle);align-items:stretch;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.app[data-device="mobile"] .topbar{height:50px;padding:0 var(--sp-3)}
.app[data-device="mobile"] .tb-search{width:auto;flex:1}
.app[data-device="mobile"] .view{padding:var(--sp-3) var(--sp-3) var(--sp-6)}
.app[data-device="mobile"] .crumbs{height:28px}
.tabbar .ti{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10px;color:var(--neutral-400);position:relative;cursor:pointer}
.tabbar .ti .ic{font-size:17px;line-height:1}
.tabbar .ti.on{color:var(--accent-600)}
.tabbar .ti .bd{position:absolute;top:2px;right:calc(50% - 18px);min-width:15px;height:15px;padding:0 4px;
  background:var(--danger-500);color:#fff;border-radius:var(--r-full);font-size:9px;line-height:15px;text-align:center}
.mstack{display:flex;flex-direction:column;gap:var(--section-gap)}
/* 移动端：表格转卡片 */
.cards{display:flex;flex-direction:column;gap:var(--sp-2)}
.rcard{background:var(--neutral-0);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--card-pad);
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;cursor:pointer}
.rcard:active{background:var(--neutral-50)}
.rcard .kv2{display:grid;grid-template-columns:auto 1fr;gap:2px var(--sp-3);margin-top:6px;font-size:var(--fs-xs)}
.rcard .kv2 .k{color:var(--neutral-500)}
.rcard .kv2 .v{font-family:var(--font-mono);color:var(--neutral-800);text-align:right;overflow:hidden;text-overflow:ellipsis}
/* 浮动操作条 */
.fab-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:var(--sp-5);z-index:30;background:var(--neutral-900);
  color:#fff;border-radius:var(--r-lg);padding:8px var(--sp-3);display:flex;align-items:center;gap:var(--sp-3);
  box-shadow:var(--shadow-lg);font-size:var(--fs-sm);animation:fadeIn .16s}
.fab-bar .btn{background:var(--neutral-0);border-color:transparent}
.app[data-device="mobile"] .fab-bar{bottom:72px}
/* 演示控制条（原型外壳，非产品界面） */
.demo{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:200;display:flex;align-items:center;gap:10px;
  background:rgba(26,29,40,.92);color:#fff;border-radius:var(--r-full);padding:6px 10px 6px 14px;font-size:12px;
  box-shadow:0 10px 30px rgba(26,29,40,.3);backdrop-filter:blur(6px)}
.demo .lb{color:rgba(255,255,255,.55)}
.demo .seg{background:rgba(255,255,255,.12);padding:2px}
