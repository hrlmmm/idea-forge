[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idea-forge"
version = "0.1.0"
description = "Idea Forge — the local forge where your agent crafts science."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
ideaforge = "ideaforge.cli:main"

[tool.setuptools.packages.find]
include = ["core*", "ideaforge*", "api*", "mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
